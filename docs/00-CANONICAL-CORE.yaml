    name: surfaces
    description: Disposable, rebuild freely. Each reads from L0-L2, never around them.
    must_not:
      - import L2 internals directly (must go through contract API)
      - hardcode tokens
      - bypass mode guards
      - hold identity state
      - directly write to D1 without L2 wrapper
