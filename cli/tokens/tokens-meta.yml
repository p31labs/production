version: 3.1-willow
metadata:
  name: p31-quantum
  description: P31 Labs Quantum Design System — mathematically perfect, visually
    breathtaking
  philosophy: |
    Everything derives from 16px × (4/3)^n, timed to 863 Hz.
    One base. One ratio. Infinite scale.
  canonical_constants:
    base_unit: 16px
    tetrahedral_ratio: 1.3333
    golden_ratio: 1.618
    larmor_hz: 863
    sic_povm_overlap: 0.3333
    k4_vertices: 4
    beta_squared: 1
    ei_number: 42-1888158
theme:
  light:
    background:
      default: "#F8FAFC"
      alt: "#FFFFFF"
    text:
      primary: "#0F172A"
      secondary: rgba(15,23,42,0.6)
      tertiary: rgba(15,23,42,0.3)
    glass_surface: rgba(0,0,0,0.03)
    glass_border: rgba(0,0,0,0.08)
    glass_border_hover: rgba(0,0,0,0.15)
bounding_boxes:
  icon_xs:
    width: calc(var(--p31-base) * 1)
    height: calc(var(--p31-base) * 1)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Very small icon (status dots, inline badges)
    usage: status-indicator, badge
  icon_sm:
    width: calc(var(--p31-base) * 1.3333)
    height: calc(var(--p31-base) * 1.3333)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Small icon (inline with text, nav icons)
    usage: nav-link-icon, button-icon
  icon_md:
    width: calc(var(--p31-base) * 2)
    height: calc(var(--p31-base) * 2)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Medium icon (feature cards, section headers)
    usage: feature-card-icon, section-icon
  icon_lg:
    width: calc(var(--p31-base) * 2.5)
    height: calc(var(--p31-base) * 2.5)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Large icon (brand crown in header, hero icons)
    usage: brand-mark, header-crown
  icon_xl:
    width: calc(var(--p31-base) * 4)
    height: calc(var(--p31-base) * 4)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Extra large icon (hero crown, standalone graphic)
    usage: hero-crown, feature-hero
  icon_favicon:
    width: calc(var(--p31-base) * 12)
    height: calc(var(--p31-base) * 12)
    container_display: block
    container_width: 100%
    container_height: 100%
    description: Favicon / app icon (browser tabs, mobile home screen)
    usage: favicon, app-icon, pwa-icon
spacing_rules:
  component_forbidden_properties:
    - marginTop
    - marginBottom
    - marginLeft
    - marginRight
    - margin
    - "transform: translateY"
    - "transform: translateX"
    - "transform: translate"
    - "position: relative"
    - "position: absolute"
    - top
    - bottom
    - left
    - right
    - "display: inline-block"
  component_forbidden_description: Components do not declare external spacing. Only templates do.
  template_allowed_properties:
    - gap
    - padding
    - paddingTop
    - paddingBottom
    - paddingLeft
    - paddingRight
    - paddingX
    - paddingY
    - align-items
    - justify-content
    - "display: flex"
    - "display: grid"
    - grid_template_columns
    - grid_template_rows
    - max_width
    - "margin: 0 auto"
  template_allowed_description: Templates control all external spacing. Components
    control only internal geometry.
  component_allowed_internal_properties:
    - background
    - backgroundColor
    - border
    - borderColor
    - borderRadius
    - boxShadow
    - color
    - fill
    - fontFamily
    - fontSize
    - fontWeight
    - height
    - lineHeight
    - opacity
    - overflow
    - padding
    - stroke
    - textAlign
    - textDecoration
    - textTransform
    - transition
    - width
    - zIndex
  component_allowed_description: These properties control internal appearance
    only. They do not affect layout positioning.
cascade_layers:
  order:
    - reset
    - tokens
    - components
    - templates
    - overrides
  description: >
    Templates always override component styling cleanly without !important
    specificity wars.

    This eliminates the need for !important hacks in Header.astro and other
    layout components.
  layer_definitions:
    reset:
      description: Normalize CSS, base resets. Lowest priority.
      includes: normalize.css, base.css
    tokens:
      description: Design tokens (CSS variables). Second lowest priority.
      includes: tokens.css, all token files
    components:
      description: Component-specific styles. Default priority.
      includes: component CSS, generated component styles
    templates:
      description: Template/layout styles. Higher priority than components.
      includes: Header.astro styles, PageLayout.astro styles
    overrides:
      description: Highest priority. One-off overrides for specific pages. Use sparingly.
      includes: page-specific styles, emergency fixes
svg_rules:
  enforce_bounding_box: true
  description: All SVGs must fit inside a bounding box defined in bounding_boxes section.
  svgo_transform:
    removeViewBox: false
    trimToVisibleContent: true
    forceContainerAspect: true
    cleanupAttrs: true
    removeDoctype: true
    removeEmptyText: true
    removeEmptyContainers: true
    cleanupIDs: true
    convertShapeToPath: true
    moveGroupAttrsToElems: true
    collapseGroups: true
    sortAttrs: true
    description: SVGO plugins to run on every SVG import. Automatically trims
      whitespace, tightens viewBox, and normalizes structure.
  viewBox_trimming:
    enabled: true
    padding: 2px
    trim_to_visible_bounds: true
    description: Automatically recalculate viewBox to the visible bounding box of
      all paths. Removes descender whitespace.
  container_wrapping:
    enabled: true
    wrapper_display: block
    wrapper_width: 100%
    wrapper_height: 100%
    description: All SVGs are wrapped in a container that enforces the bounding box
      dimensions.
agent_prompt_injection:
  description: This section is injected into Claude, Gemini, and Kilo prompts.
  claude:
    role: React / Component Developer
    instruction: >
      When generating React components:

      1. Read the bounding_boxes section to know the exact dimensions of icons
      and SVG containers.

      2. NEVER use marginTop, marginBottom, or any forbidden property listed in
      spacing_rules.component_forbidden_properties.

      3. Always wrap SVGs in a container that matches the bounding box
      dimensions.

      4. Use internal styling only (component_allowed_internal_properties).

      5. Run your generated code through the SpatialValidator before submission.

      6. Use scale tokens (--p31-scale-*) for sizing. Derive everything from
      --p31-base.

      7. Use color.quantum tokens for accents, color.surface for backgrounds,
      color.text for typography.
  gemini:
    role: Layout / Template Designer
    instruction: >
      When designing page layouts and templates:

      1. Use the layout_containers section to define macro-architecture.

      2. Define slots with explicit bounding box expectations.

      3. Use only template_allowed_properties for external spacing.

      4. Understand that components cannot declare margin; spacing is your job.

      5. Respect the cascade_layers order — templates override components, not
      the other way around.

      6. Use scale tokens (--p31-scale-*) for spacing. Use spacing tokens
      (--p31-space-*) for gaps.

      7. Use typography.size tokens for font sizes. All are fluid clamp()
      values.
  kilo:
    role: Implementation / Execution Engine
    instruction: >
      When executing the build pipeline:

      1. Read the svg_rules section and run SVGO normalization on all SVG
      imports.

      2. Validate all components against the spacing_rules section using
      SpatialValidator.

      3. Fail the build if any component violates the rules.

      4. Ensure all generated code respects the cascade_layers order.

      5. Generate CSS from tokens using the export scripts in cli/tokens/.

      6. Run p31 health before deployment.
examples:
  crown_svg:
    description: Crown.svg — how it should be configured to fit icon_lg bounding box
    before: |
      <svg viewBox="0 0 200 200" style={{ marginTop: '-4px' }}>  ← ❌ VIOLATION
    after: |
      <svg viewBox="0 18 200 164" className="crown-svg">  ← ✅ CLEAN
    notes: |
      - viewBox is trimmed to visible content (top whitespace removed)
      - No margin, marginTop, or transform hacks
      - SVG fills its 40×40 container naturally
  header_example:
    description: Header.astro — how to use the Header layout container
    code: |
      <div class="header-wrapper">
        <header class="header-container">
          <div class="header-brand-slot">
            <Crown />  ← Component with NO external spacing
          </div>
          <nav class="header-nav-slot">
            <a href="/">Home</a>
          </nav>
          <div class="header-actions-slot">
            <SignInButton />  ← Component with NO external spacing
          </div>
        </header>
      </div>
    notes: |
      - Header container enforces height: calc(var(--p31-base) * 3) = 48px
      - All children are centered via align-items: center
      - Components have no margin, so alignment is perfect
      - No hacks needed
