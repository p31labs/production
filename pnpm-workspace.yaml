packages:
  - 'packages/*'
  - 'apps/*'
  - 'workers/*'
allowBuilds:
  '@bundled-es-modules/glob': false
  '@coinbase/x402': true
  '@playwright/browser-chromium': false
  bufferutil: false
  core-js-pure: false
  esbuild: true
  keccak: true
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  style-dictionary: false
  unix-dgram: false
  utf-8-validate: false
  workerd: true

# Design-system packages declare their mutual versions once. Both the catalog:
# and workspace: protocols are replaced on publish.
catalog:
  '@p31ca/canon': workspace:^
  '@p31ca/design-core': workspace:^
  '@p31ca/ui': workspace:^

# The three design-system packages ship as one unit — always the same version.
versioning:
  fixed:
    - - '@p31ca/canon'
      - '@p31ca/design-core'
      - '@p31ca/ui'
