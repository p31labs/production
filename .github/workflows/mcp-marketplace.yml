name: mcp-marketplace

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Marketplace Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: cd portals/mcp-marketplace && pnpm install --frozen-lockfile
      - name: Typecheck
        run: cd portals/mcp-marketplace && pnpm typecheck
      - name: Lint
        run: cd portals/mcp-marketplace && pnpm lint
      - name: Unit tests
        run: cd portals/mcp-marketplace && pnpm test
      - name: v:gate (design-system vendor integrity)
        run: cd portals/mcp-marketplace && pnpm v:gate
      - name: Build
        run: cd portals/mcp-marketplace && pnpm build