name: p31-mcp-membrane
displayName: P31 Membrane
description: Post-deploy verification MCP server with DORA metrics, deploy checks, gamified XP/LOVE rewards, and artifact minting
runtime: node
command: npx
args:
  - -y
  - "@p31ca/mcp-membrane"
tools:
