component: SpoonDialEditor
narrative: |
  User declares current energy level; the whole system re-targets from this one control.
  Engagement matters more than goal completion; must stay functional at spoon 0.
constraints:
  accessibility: { wcag: AA, contrast: 4.5, touchTarget: 44 }
  performance: { bundle: 2, renderTime: 16.67 }
  loveSemantics:
    - { trigger: on-set-level, reward: 1, recipient: [user], description: Self-awareness }
