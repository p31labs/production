name = "entitlement"
main = "src/index.ts"
compatibility_date = "2026-09-02"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`):
#   ADMIN_TOKEN — bearer for POST /entitlement/tier-set

[[d1_databases]]
binding = "DB"
database_name = "p31-entitlement"
database_id = "REPLACE_ME_WITH_D1_ID"

[observability]
enabled = true