name = "marketplace-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

# D1 for trust tier lookups
[[d1_databases]]
binding = "LOVE_DB"
database_name = "love-ledger"
database_id = "592e3e2e-3203-4e0a-8342-9e85215ec8a6"

[[durable_objects.bindings]]
name = "CATALOG_DO"
class_name = "MarketplaceCatalogDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarketplaceCatalogDO"]

[vars]
ENVIRONMENT = "production"
# OAuth 2.1 resource server (RFC 8707) — the resource URI that bearer-token
# `aud` claims MUST match (single source of truth with the RFC 9728 metadata).
# When RESOURCE_ID + OAUTH_JWKS_URL are set, the bearer gate activates on
# tools/call; unset → open access (opt-in). See
# docs/enterprise/api/oauth-21-rollout-runbook.md.
RESOURCE_ID = "https://marketplace-mcp.trimtab-signal.workers.dev/mcp"
OAUTH_JWKS_URL = "https://oauth-relay.trimtab-signal.workers.dev/.well-known/jwks.json"
# RFC 9207 — expected bearer-token issuer. Optional: when unset the verifier
# derives the issuer from the OAUTH_JWKS_URL origin. Set explicitly to pin a
# different issuer identifier: OAUTH_ISSUER = "https://oauth-relay.trimtab-signal.workers.dev"

[observability]
enabled = true

[cache]
enabled = true
