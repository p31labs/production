name = "oauth-relay"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "p31-oauth"
database_id = "02563d5f-3e44-475c-9fc6-54caebd0c0be"

[vars]
GOOGLE_CLIENT_ID = ""
GOOGLE_CLIENT_SECRET = ""
GITHUB_CLIENT_ID = ""
GITHUB_CLIENT_SECRET = ""
SHELL_ORIGIN = "https://p31-shell.trimtab-signal.workers.dev"
# Client ID Metadata Documents (CIMD, preferred over deprecated RFC 7591 DCR by
# MCP 2026-07-28). When "true", URL-form client_ids are resolved to their
# metadata document as the redirect-uri allowlist. Off by default.
CIMD_ENABLED = ""

[observability]
enabled = true
