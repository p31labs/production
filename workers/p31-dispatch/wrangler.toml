name = "p31-dispatch"
main = "src/index.ts"
compatibility_date = "2026-07-29"

[vars]
SUBSTRATE_ENABLED = "false"
PASSPORT_WORKER_URL = "https://p31-passport.trimtab-signal.workers.dev"

[[services]]
binding = "PASSPORT_WORKER"
service = "p31-passport"

[[durable_objects.bindings]]
class_name = "RateLimitDO"
name = "RATE_LIMITER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimitDO"]

[limits]
cpu_ms = 5000
sub_requests = 50
