name = "agent-runtime"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

# Agents SDK runtime: AgentRuntime is a Durable Object.
[[durable_objects.bindings]]
name = "AgentRuntime"
class_name = "AgentRuntime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentRuntime"]

# love-ledger Worker — care-score / balance lookups for generate_care_report.
[[services]]
binding = "LOVE_LEDGER"
service = "love-ledger"

# send_notification (v1: telegram) — bot token set via:
#   wrangler secret put TELEGRAM_BOT_TOKEN
# (reuse the Cloudflare Secrets Store by binding it here if preferred.)

# TODO: Add [exports.AgentRuntime] section with type = "durable-object" and storage = "sqlite"
# WARNING: Missing [exports] config for Durable Object(s) — manual handling required.

# CWP-2026-016 (C) — Spike Land MCP integration (staged, OFF by default).
# Endpoint discovered 2026-07-12: the hosted MCP server is `https://mcp.spike.land/mcp`
# (NOT spike.land/mcp or api.spike.land/mcp). It is Streamable-HTTP MCP and requires
# `Authorization: Bearer <token>` where token is a Spike Land API key (`sk_...`,
# from https://spike.land/settings?tab=api-keys) or OAuth access token (`mcp_...`).
# `initialize` is auth-gated (401 without token); `tools/list` needs an initialized
# session. To enable: set ENABLE_SPIKE_LAND = "true" + `wrangler secret put SPIKE_LAND_API_KEY`.
[vars]
ENABLE_SPIKE_LAND = "false"
SPIKE_LAND_MCP_URL = "https://mcp.spike.land/mcp"

[observability]
enabled = true

[cache]
enabled = true
