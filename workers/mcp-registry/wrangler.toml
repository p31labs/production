name = "mcp-registry"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# OAuth 2.1 resource-server (RFC 8707) — the resource URI that bearer-token
# `aud` claims MUST match, and the fleet AS JWKS endpoint (oauth-relay).
# Plain vars per the capital-machine reference pattern. When OAUTH_JWKS_URL
# is unset, bearer validation is disabled and the server stays open.
[vars]
RESOURCE_ID = "https://mcp-registry.trimtab-signal.workers.dev/mcp"
OAUTH_JWKS_URL = "https://oauth-relay.trimtab-signal.workers.dev/.well-known/jwks.json"
# RFC 9207 — expected bearer-token issuer. Optional: when unset the verifier
# derives the issuer from the OAUTH_JWKS_URL origin. Set explicitly to pin a
# different issuer identifier: OAUTH_ISSUER = "https://oauth-relay.trimtab-signal.workers.dev"

# Secrets (ADMIN_TOKEN, REVIEW_SIGNING_KEY, REVIEW_SIGNING_KEY_PREV,
# ADMIN_SECRET, INTERNAL_USAGE_KEY) are set via `wrangler secret put` —
# never committed. Local dev values live in .dev.vars (gitignored).
#   ADMIN_SECRET       — gates POST /servers/:id/approve + GET /analytics/tools
#   INTERNAL_USAGE_KEY — gates POST /internal/usage (bridge write-side,
#                        header X-Internal-Usage-Key)

[[kv_namespaces]]
binding = "REGISTRY_KV"
id = "0f08cff0858a40b49da004ba9d90f900"

# D1 — per-tool usage counters (E-2). The bridge write-side POSTs
# {server, tool} to /internal/usage; counters upsert into usage_events.
[[d1_databases]]
binding = "USAGE_DB"
database_name = "mcp-registry-usage"
database_id = "332890dc-864c-4de9-bdc1-7d502556727f"
migrations_dir = "migrations"

# Durable Object backing the audit + transparency hash chains (N3).
# One instance per log name ('audit', 'transparency') — independent
# verification boundaries, single-writer, strongly consistent.
[[durable_objects.bindings]]
name = "LEDGER"
class_name = "LedgerLog"

[[migrations]]
tag = "v1-ledger"
new_sqlite_classes = ["LedgerLog"]

# Service bindings to the MCP servers this registry can reach internally.
# Public workers.dev → workers.dev fetch fails DNS 1042; a service binding
# routes the probe/call without the public URL hop. Each remote catalog entry
# in the same Cloudflare account gets a binding here; entries without a
# binding fall back to public fetch (custom domains work fine).
[[services]]
binding = "MUSIC_MAKER_MCP"
service = "music-maker-mcp"

[[services]]
binding = "P31_CRYPTO_MCP"
service = "p31-crypto-mcp"

[[services]]
binding = "P31_JUSTICE_HUB"
service = "p31-justice-hub"

[[services]]
binding = "BROS"
service = "bros"

[[services]]
binding = "DADS"
service = "dads"

[[services]]
binding = "MARKETPLACE"
service = "marketplace-mcp"

[[services]]
binding = "PHENIX_WALLET"
service = "phenix-wallet-mcp"

[[services]]
binding = "X402_GATEWAY"
service = "mcp-x402-gateway"
[[services]]
binding = "ROBLOX_BRIDGE"
service = "roblox-bridge"

[[services]]
binding = "P31_MCP_SERVER"
service = "p31-mcp-server"

[[services]]
binding = "P31_SHELL"
service = "p31-shell"

[[services]]
binding = "SPACESHIP_RELAY"
service = "spaceship-relay"

[[services]]
binding = "DESIGN_MCP"
service = "p31-design-mcp"
