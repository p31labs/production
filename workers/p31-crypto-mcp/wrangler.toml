name = "p31-crypto-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
VERSION = "1.0.0"
LEDGER_BRIDGE_URL = "https://ledger-bridge.trimtab-signal.workers.dev"
FEDERATION_BRIDGE_URL = "https://federation.trimtab-signal.workers.dev"
TALER_BRIDGE_URL = "https://taler-bridge-billing.trimtab-signal.workers.dev"
X402_GATEWAY_URL = "https://mcp-x402-gateway.trimtab-signal.workers.dev"
# OAuth 2.1 resource-server (RFC 8707) — the resource URI that bearer-token
# `aud` claims MUST match, and the fleet AS JWKS endpoint (oauth-relay).
# Plain vars per the capital-machine reference pattern. When OAUTH_JWKS_URL
# is unset, bearer validation is disabled and the server stays open.
RESOURCE_ID = "https://p31-crypto-mcp.trimtab-signal.workers.dev/mcp"
OAUTH_JWKS_URL = "https://oauth-relay.trimtab-signal.workers.dev/.well-known/jwks.json"
# RFC 9207 — expected bearer-token issuer. Optional: when unset the verifier
# derives the issuer from the OAUTH_JWKS_URL origin. Set explicitly to pin a
# different issuer identifier: OAUTH_ISSUER = "https://oauth-relay.trimtab-signal.workers.dev"

[observability]
enabled = true

[cache]
enabled = true
