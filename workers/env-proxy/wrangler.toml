# env-proxy — BFF for the Quantum Material .env app (Phase 1, read-only).
# Lists Worker secret NAMES (values never leave the Cloudflare API) against the
# curated fleet manifest, plus D1-backed audit + status aggregation.
name = "env-proxy"
main = "src/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cloudflare account id whose Worker scripts are probed.
CF_ACCOUNT_ID = "ee05f70c889cb6f876b9925257e3a2fa"
# CORS: the standalone .env app origin. "*" for now — set to
# https://env.p31ca.org when that origin is confirmed.
ALLOWED_ORIGINS = "*"

# Required secrets (wrangler secret put, never in code):
#   ENV_PROXY_TOKEN — bearer token for the WRITE/reveal routes (Phase 2).
#   CF_API_TOKEN    — scoped API token: "Workers Scripts: Read" +
#                     "Account Secrets Store: Read". NOT YET SET (see README.md).
# CF_API_TOKEN is NOT in `required` so Phase-1 (names-only public reads) can
# deploy without it; /env/list returns an honest "not configured" until set.
[secrets]
required = ["ENV_PROXY_TOKEN"]

[[d1_databases]]
binding = "ENV_META"
database_name = "env-meta"
database_id = "708c0214-8b60-4997-8c11-d1d2845b3073"

[observability]
enabled = true

[cache]
enabled = true