name = "p31-monetization"
main = "src/worker.ts"
compatibility_date = "2026-09-02"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   ROLE_JWT_SECRET        — HS256 role-token signing secret
#   ADMIN_TOKEN            — bearer token for POST /api/auth/token (role issuance)
#   SBT_ISSUE_TOKEN        — shared token forwarded to p31-sbt for SBT issuance
#   ZERO_TRUST_TEAM_DOMAIN — Cloudflare Access team domain (e.g. "trimtab");
#                            enables Cf-Access-Jwt-Assertion validation on write routes

[assets]
directory = "./dist"
binding = "ASSETS"

# Feature flags — empty = off. OAUTH21_ENABLED "true" activates the OAuth 2.1 /
# RFC 8707 audience-bound role tokens (docs/ZERO-TRUST.md §4).
[vars]
OAUTH21_ENABLED = ""

[[services]]
binding = "REVENUE_LEDGER"
service = "revenue-ledger"

[[services]]
binding = "ENTITLEMENT"
service = "entitlement"

[[services]]
binding = "AUTO_COMPOUNDER"
service = "p31-auto-compounder"

[[services]]
binding = "MEV_ARBITRAGE"
service = "mev-arbitrage"

[[services]]
binding = "YIELD_VAULT"
service = "yield-vault"

[[services]]
binding = "ALLOCATOR"
service = "capital-allocator"

[[services]]
binding = "CONFIG_GATEWAY"
service = "config-gateway"

[[services]]
binding = "BTCPAY_GATEWAY"
service = "btcpay-gateway"

[[services]]
binding = "SBT_GATEWAY"
service = "p31-sbt"

[[services]]
binding = "DORA_GATEWAY"
service = "p31-ci"

# Auth D1 — passkey persistence + OAuth 2.1 session state (docs/ZERO-TRUST.md §4).
# Schema: migrations/0001_auth.sql. Created with
#   wrangler d1 create p31-monetization-auth   (replace database_id with the
#   UUID it returns — repo convention, cf. workers/config-gateway/wrangler.toml).
[[d1_databases]]
binding = "AUTH_DB"
database_name = "p31-monetization-auth"
database_id = "REPLACE_ME_WITH_D1_ID"
migrations_dir = "migrations"
