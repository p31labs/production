<!DOCTYPE html>
<html lang="en" data-spoons="3" data-p31-skin="cipher" data-theme="quantum" data-brand="tetra-ops">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TETRA OPS — Sovereign Operator Dashboard</title>
    <meta name="description" content="Central operations dashboard for the P31 sovereign stack. Manage all 5 apps plus builders." />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="origin-trial" content="A4rGnF5xw8cNifIvg1yPE2wYpDFs/Hxunt4xy5EyTKmtjxxYvA6by2pgYJpMxjplhLaqkwwWxXlneJ6F68BhHmUAAABweyJvcmlnaW4iOiJodHRwczovL3AzMWNhLm9yZzo0NDMiLCJmZWF0dXJlIjoiV2ViTUNQIiwiZXhwaXJ5IjoxNzg4OTYyMDYyLCJpc1N1YmRvbWFpbiI6dHJ1ZSwiaXNUaGlyZFBhcnR5Ijp0cnVlfQ==">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='oklch(65%200.18%20195)'/><polygon points='50,15 80,70 20,70' fill='none' stroke='%23fff' stroke-width='3'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        // Single source of truth: data-p31-skin attribute
        var saved = localStorage.getItem('p31-skin');
        if (saved) document.documentElement.setAttribute('data-p31-skin', saved);
        // Spoon init
        var spoons = localStorage.getItem('p31:spoons');
        if (/^[0-5]$/.test(spoons || '')) document.documentElement.setAttribute('data-spoons', spoons);
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to dashboard</a>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Theme orb — dispatches skin:changed events, skin-system handles the rest -->
    <script>
    (function(){'use strict';
    // Skin definitions (label + emoji only — CSS vars managed by skin-system)
    var SKINS = {cipher:'🔮 Cipher',garden:'🌿 Garden',retro:'🕹️ Retro',ocean:'🌊 Ocean',sunset:'🌅 Sunset',mono:'⚪ Mono',frost:'❄️ Frost',ember:'🔥 Ember',willow:'🌿 Willow',phos:'💜 Phos',tetra:'🔷 Tetra',apex:'⭐ Apex'};
    var IDS = Object.keys(SKINS);
    var cur = document.documentElement.getAttribute('data-p31-skin') || 'cipher';

    // Listen for skin changes from React app
    window.addEventListener('skin:changed', function(e) {
      if (e.detail && e.detail.skin) {
        cur = e.detail.skin;
        document.documentElement.setAttribute('data-p31-skin', cur);
        var emoji = document.getElementById('p31-orb-emoji');
        if (emoji) emoji.textContent = (SKINS[cur] || cur).split(' ')[0];
      }
    });

    // Create orb
    var o = document.createElement('div'); o.id = 'p31-theme-orb';
    o.setAttribute('role','button'); o.setAttribute('aria-label','Toggle skin');
    o.setAttribute('tabindex','0');
    o.style.cssText = 'position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);cursor:pointer;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)';
    var e = document.createElement('span'); e.id = 'p31-orb-emoji'; e.textContent = (SKINS[cur] || '🔮').split(' ')[0]; o.appendChild(e);
    o.onclick = function() {
      var idx = IDS.indexOf(cur);
      cur = IDS[(idx + 1) % IDS.length];
      window.dispatchEvent(new CustomEvent('skin:request', { detail: { skin: cur } }));
    };
    var t = document.createElement('div'); t.id = 'p31-orb-tooltip';
    t.style.cssText = 'position:fixed;bottom:80px;right:24px;padding:6px 12px;border-radius:8px;background:#000;border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:11px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9998;white-space:nowrap';
    t.textContent = '🎨 ' + (SKINS[cur] || 'cipher');
    document.body.appendChild(t); document.body.appendChild(o);
    o.onmouseenter = function(){t.style.opacity='1'}; o.onmouseleave = function(){t.style.opacity='0'};
    o.onclick = function() {
      var idx = IDS.indexOf(cur);
      cur = IDS[(idx + 1) % IDS.length];
      t.textContent = '🎨 ' + (SKINS[cur] || cur);
      document.documentElement.setAttribute('data-p31-skin', cur);
      var emoji = document.getElementById('p31-orb-emoji');
      if (emoji) emoji.textContent = (SKINS[cur] || cur).split(' ')[0];
      localStorage.setItem('p31-skin', cur);
      window.dispatchEvent(new CustomEvent('skin:request', { detail: { skin: cur } }));
    };
    })();
    </script>
  </body>
</html>
