<!DOCTYPE html>
<html lang="en" data-spoons="3" data-theme="quantum">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Willow Preview — P31 Labs</title>
    <meta name="theme-color" content="#030608" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2334d399'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23030608'%3E🌿%3C/text%3E%3C/svg%3E" />
    <script type="module" src="/lib/p31-skin-engine.mjs"></script>
    <script>
      (function () {
        if (typeof applySkin === 'function') {
          var saved = localStorage.getItem('p31:skin');
          if (saved) applySkin(saved);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var SKINS = {cipher:'🔮 Cipher',garden:'🌿 Garden',retro:'🕹️ Retro',ocean:'🌊 Ocean',sunset:'🌅 Sunset',mono:'⚪ Mono',frost:'❄️ Frost',ember:'🔥 Ember',willow:'🌿 Willow',phos:'💜 Phos',tetra:'🔷 Tetra',apex:'⭐ Apex'};
        var cur = document.documentElement.getAttribute('data-theme') || 'cipher';
        var o = document.createElement('div');
        o.id = 'p31-theme-orb';
        o.setAttribute('data-mcp-tool', 'themeToggle');
        o.setAttribute('data-mcp-type', 'control');
        o.setAttribute('data-mcp-target', 'theme-orb');
        o.setAttribute('data-mcp-state', cur);
        o.setAttribute('role', 'button');
        o.setAttribute('aria-label', 'Toggle skin');
        o.setAttribute('tabindex', '0');
        o.title = 'Click to shake — Hold to cycle themes';
        var e = document.createElement('span');
        e.id = 'p31-orb-emoji';
        e.textContent = (SKINS[cur] || '🔮').split(' ')[0];
        o.appendChild(e);
        o.style.cssText = 'position:fixed;bottom:24px;right:24px;width:48px;height:48px;border-radius:50%;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);cursor:pointer;z-index:9999;display:flex;align-items:center;justify-content:center;font-size:20px;transition:all .3s ease;box-shadow:0 4px 20px rgba(0,0,0,.3)';
        var a = false, ht = null, ci = null;
        o.addEventListener('mousedown', function () {
          ht = setTimeout(function () { a = true; var idx = Object.keys(SKINS).indexOf(cur); ci = setInterval(function () { idx = (idx + 1) % Object.keys(SKINS).length; cur = Object.keys(SKINS)[idx]; applySkin(cur); e.textContent = (SKINS[cur] || cur).split(' ')[0]; o.dataset.mcpState = cur; }, 400); }, 300);
        });
        o.addEventListener('mouseup', function () {
          if (ht) { clearTimeout(ht); ht = null; }
          if (ci) { clearInterval(ci); ci = null; }
          if (!a) {
            var ids = Object.keys(SKINS);
            var next = ids[(ids.indexOf(cur) + 1) % ids.length];
            cur = next;
            applySkin(cur);
            e.textContent = (SKINS[cur] || cur).split(' ')[0];
            o.dataset.mcpState = cur;
          } else { a = false; }
        });
        o.addEventListener('mouseleave', function () {
          if (ht) { clearTimeout(ht); ht = null; }
          if (ci) { clearInterval(ci); ci = null; }
          a = false;
        });
        o.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); o.dispatchEvent(new Event('mousedown')); setTimeout(function () { o.dispatchEvent(new Event('mouseup')); }, 100); }
        });
        document.body.appendChild(o);
      })();
    </script>
  </body>
</html>
