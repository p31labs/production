<!DOCTYPE html>
<html lang="en" class="dark" style="color-scheme: dark;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline | P31 Constellation</title>
  <meta name="theme-color" content="#050505">
  <link rel="stylesheet" href="/p31-style.css">
  <style>
    /* Critical inline styles for offline page - no external dependencies */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      background: #0A0A0F;
      color: rgba(255, 255, 255, 0.9);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 2rem;
      background: rgba(16, 185, 129, 0.1);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 300px;
    }
    button {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: rgb(16, 185, 129);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 48px;
    }
    button:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.6);
    }
    button:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.4);
      font-family: monospace;
    }
    .cached-content {
      margin-top: 2rem;
      padding: 1.5rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      max-width: 400px;
      text-align: left;
    }
    .cached-content h2 {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .cached-content ul {
      list-style: none;
    }
    .cached-content li {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cached-content li:last-child {
      border-bottom: none;
    }
    .cached-content a {
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: color 0.2s ease;
    }
    .cached-content a:hover {
      color: rgb(16, 185, 129);
    }
    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.5);
    }
  </style>
</head>
<body>
  <div class="offline-icon">📡</div>
  <h1>You're Offline</h1>
  <p>The P31 Constellation requires a network connection for real-time mesh data. Some cached content may still be available.</p>

  <div class="actions">
    <button onclick="location.reload()">Try Again</button>
    <button onclick="checkConnection()">Check Connection</button>
  </div>

  <div id="status" class="status"></div>

  <div class="cached-content" id="cached-links" style="display: none;">
    <h2>Available Offline</h2>
    <ul id="offline-links">
      <!-- Populated by JavaScript -->
    </ul>
  </div>

  <script>
    // Check connection status
    function checkConnection() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = 'Connection detected! Reloading...';
        setTimeout(() => location.reload(), 1000);
      } else {
        status.textContent = 'Still offline. Check your network settings.';
      }
    }

    // Listen for online event
    window.addEventListener('online', () => {
      const status = document.getElementById('status');
      status.textContent = 'Back online! Reloading...';
      setTimeout(() => location.reload(), 1500);
    });

    // Show cached pages if Service Worker is active
    if ('caches' in window) {
      caches.open('p31-hub-shell-v2').then(cache => {
        cache.keys().then(requests => {
          const links = document.getElementById('offline-links');
          const container = document.getElementById('cached-links');
          const pages = requests.filter(req =>
            req.url.endsWith('.html') || req.url.endsWith('/')
          );

          if (pages.length > 0) {
            container.style.display = 'block';
            links.innerHTML = pages.map(req => {
              const url = new URL(req.url);
              const path = url.pathname === '/' ? '/' : url.pathname;
              const label = path === '/' ? 'Home (Hub)' : path.replace(/\//g, ' ').trim();
              return `<li><a href="${path}"><span class="indicator"></span>${label}</a></li>`;
            }).join('');
          }
        }).catch(() => {
          // Cache not available yet
        });
      });
    }

    // Initial connection check
    if (navigator.onLine) {
      document.getElementById('status').textContent = 'Connection available - attempting reload...';
      setTimeout(() => location.reload(), 3000);
    }
  </script>
</body>
</html>
