name = "love-ledger"
main = "index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

# Canonical custom domain for the deployed ledger. Requires the p31ca.org
# zone to be in the same Cloudflare account. If the route fails to
# provision, the worker still serves from love-ledger.<account>.workers.dev.
routes = [
  { pattern = "love-ledger.p31ca.org/*", zone_name = "p31ca.org" },
]

[placement]
mode = "smart"

[[d1_databases]]
binding = "LOVE_DB"
database_name = "love-ledger"
database_id = "592e3e2e-3203-4e0a-8342-9e85215ec8a6"

[[r2_buckets]]
binding = "LOVE_ARCHIVE"
bucket_name = "love-ledger-archive"

# Cold per-DID WORM archive is now owned by phos-backup's cron. Explicitly
# empty crons frees the Free Plan cron slot (the "0 */6 * * *" trigger that
# was live on deploy is removed on next `wrangler deploy`).
[triggers]
crons = []

# Axis-1: Clause Blind Schnorr WASM (Rust + curve25519-dalek) is
# pre-compiled at deploy time via [[rules]] type = "CompiledWasm" (ES
# module Workers cannot use [wasm_modules], and runtime WebAssembly
# code-gen from raw bytes is blocked by workerd). index.ts imports it as
# a WebAssembly.Module and instantiates it once. See §6.1.

# Pre-compile the CBS wasm so it imports as a WebAssembly.Module.
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# BLIND_MODE is fail-closed: anything other than 'taler' → /withdraw 500s
# (no mint path exists). Set via secret/var per environment.
[vars]
BLIND_MODE = "taler"
ENVIRONMENT = "production"
# On-chain attestation bridge (CWP-2026-022). love-ledger anchors every
# court-admissible love_chain entry here for verifiable on-chain witnesses.
BRIDGE_URL = "https://ledger-bridge.trimtab-signal.workers.dev"

[observability]
enabled = true

# Axis-6 LOVE settlement HMAC shared secret. Centralised in the Cloudflare
# Secrets Store (`p31-secrets`, store-id 33d48162fd6842869beeed3516e2909c) so a
# single rotation propagates to every bound Worker. Resolved at runtime via
# `await env.LOVE_AUTH_SECRET.get()`. Replaces the legacy per-worker
# `wrangler secret put LOVE_AUTH_SECRET`.
[[secrets_store_secrets]]
binding = "LOVE_AUTH_SECRET"
store_id = "33d48162fd6842869beeed3516e2909c"
secret_name = "LOVE_AUTH_SECRET"
