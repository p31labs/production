name = "phos-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-05-31"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers AI binding (local inference)
[ai]
binding = "AI"

# Backend target URLs (override via vars if needed)
[vars]
EDGE_AI_URL = "https://phos-ai-backend.trimtab-signal.workers.dev"
JITTERBUG_API_URL = "https://jitterbug-api.trimtab-signal.workers.dev"

# Zero-retention observability
[observability]
enabled = false
