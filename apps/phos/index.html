        var w = window.innerWidth;

        else if (w >= 768 && w <= 1023) sc = 'medium';
        else if (w >= 1024) sc = 'expanded';
        document.documentElement.dataset.sizeClass = sc;
        var hasTouch = window.matchMedia('(pointer: coarse)').matches;
        var hasMouse = window.matchMedia('(pointer: fine)').matches;
        document.documentElement.dataset.input = hasTouch && hasMouse ? 'hybrid' : hasTouch ? 'touch' : 'mouse';
      })();

(function(){'use strict';
var T={};
T.setSpoonLevel={description:'Set spoon level 0-5',inputSchema:{type:'object',properties:{level:{type:'number',minimum:0,maximum:5}},required:['level']},execute:async function(a){var c=Math.max(0,Math.min(5,Number(a.level)));document.documentElement.setAttribute('data-spoons',String(c));var r=document.getElementById('spoon-dial');if(r){r.value=c;r.dispatchEvent(new Event('input',{bubbles:true}))}window.dispatchEvent(new CustomEvent('spoons:changed',{detail:{level:c},bubbles:true}));return{success:true,level:c}}};
T.setStatus={description:'Set status badge',inputSchema:{type:'object',properties:{status:{type:'string',enum:['online','offline','busy','away']}},required:['status']},execute:async function(a){var b=document.querySelector('[data-mcp-tool="statusBadge"]');if(!b)return{success:false,error:'Not found'};b.dataset.status=b.dataset.mcpState=a.status;var l=b.querySelector('.status-label');if(l)l.textContent=a.status.charAt(0).toUpperCase()+a.status.slice(1);return{success:true,status:a.status}}};
T.navigate={description:'Navigate to URL',inputSchema:{type:'object',properties:{href:{type:'string'},external:{type:'boolean'}},required:['href']},execute:async function(a){a.external?window.open(a.href,'_blank','noopener,noreferrer'):window.location.href=a.href;return{success:true,href:a.href}}};
T.toggleDrawer={description:'Toggle drawer',inputSchema:{type:'object',properties:{state:{type:'string',enum:['open','closed','toggle']},target:{type:'string'}},required:['state']},execute:async function(a){var d=a.target?document.querySelector(a.target):document.querySelector('[data-mcp-tool="toggleDrawer"]');if(!d)return{success:false,error:'Not found'};var o=a.state==='toggle'?!d.hasAttribute('open'):a.state==='open';o?(d.setAttribute('open',''),d.dispatchEvent(new Event('open',{bubbles:true}))):(d.removeAttribute('open'),d.dispatchEvent(new Event('close',{bubbles:true})));return{success:true,state:o?'open':'closed'}}};
var _ctx2=(typeof document!=='undefined'&&document.modelContext)?document.modelContext:(typeof navigator!=='undefined'&&navigator.modelContext)?navigator.modelContext:null;if(_ctx2){Object.keys(T).forEach(function(n){_ctx2.registerTool({name:n,description:T[n].description,inputSchema:T[n].inputSchema,execute:T[n].execute})})}
window.__p31MCPTools=T;
window.__p31MCPExec=function(n,a){return T[n]?T[n].execute(a):{success:false,error:'Unknown: '+n}};

})();
