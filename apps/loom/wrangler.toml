# The Loom — Cloudflare Pages project.
# Mirrors apps/p31ca/wrangler.toml (pages_build_output_dir = "dist").
name = "loom"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-04"

# CONFIG REQUIRED — set these in the Cloudflare dashboard / as secrets:
#   * LOOM_D1 — a D1 database created via `wrangler d1 create loom`. This
#     binding points the REST API (Pages Functions) at the log.
#   * CLOUDFLARE_ACCESS_DOMAIN — the Zero Trust team domain, e.g.
#     https://p31.cloudflareaccess.com
#   * CLOUDFLARE_ACCESS_AUD — the Access application audience tag for the
#     Loom's application.
# These are Cloudflare-side values; the code below consumes them via the
# env bindings and the Access Pages plugin.

[[d1_databases]]
binding = "LOOM_D1"
database_name = "loom"
# CONFIG REQUIRED — replace with the id from `wrangler d1 create loom`.
database_id = "87f9bc5c-e74e-4c61-8405-a0ed04671194"

[vars]
CLOUDFLARE_ACCESS_DOMAIN = "https://p31ca.cloudflareaccess.com"
# Loom Access app (2026-09-28, recreated after WS-4): self-hosted,
# loom-8z0.pages.dev, preview_urls_enabled = true (gates <hash>.loom-8z0.pages.dev
# under one AUD). Old aud 632d76e1… pointed at the deleted app — replaced by
# the recreated app's aud (matches the zone-scoped Loom app 8f7cd3a7-…).
CLOUDFLARE_ACCESS_AUD = "2518af42a528ac91104f4110f764c2e477abf30d66a0ab07c3362c56941aa8a9"
# LUMI enforcement rollout state — see docs/GOVERNANCE.md. Start in OBSERVE
# (records would-be refusals, allows events); promote to enforce per the
# runbook once the observation window is clean.
LUMI_ENFORCEMENT = "observe"

# Service binding to the SSE Worker — the Pages Functions proxy /stream and
# /broadcast to it (the Worker's Durable Object cannot be reached from Pages
# Functions directly).
services = [
  { binding = "LOOM_SSE", service = "loom-sse" },
]