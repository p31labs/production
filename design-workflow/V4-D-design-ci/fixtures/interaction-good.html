<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interaction-good</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  button {
    font-size: 1rem; padding: 12px 20px; min-height: 44px;
    background: #1a2b3c; color: #f5f7fa; border: 1px solid #33475c; border-radius: 8px;
    transition: background-color 120ms ease;
  }
  button:hover { background: #24374d; }
  button:focus-visible { outline: 3px solid #58a6ff; outline-offset: 2px; }
  button:active { background: #0d1a28; transform: translateY(1px); }
  a { color: #58a6ff; text-decoration: none; }
  a:hover { text-decoration: underline; color: #9ecbff; }
  a:focus-visible { outline: 2px solid #58a6ff; }
  a:active { color: #d5e9ff; }
</style>
</head>
<body>
  <button type="button">Primary action</button>
  <a href="#top">nav link</a>
</body>
</html>
