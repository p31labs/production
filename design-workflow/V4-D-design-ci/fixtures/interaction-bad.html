<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interaction-bad</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  /* deliberately NO :hover / :focus-visible / :active author styles — negative control.
     appearance:none + outline:none suppress the UA defaults so all three states
     provably fail (a suppressed focus outline with no replacement is the real
     accessibility failure pattern). */
  button { font-size: 1rem; padding: 12px 20px; min-height: 44px;
    appearance: none; outline: none;
    background: #1a2b3c; color: #f5f7fa; border: 1px solid #33475c; border-radius: 8px; }
</style>
</head>
<body>
  <button type="button">No states</button>
</body>
</html>
