# Nightly QA Suite
# Runs comprehensive nightly tests across all deployable units.

name: Nightly QA Suite

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tests:
        description: 'Specific tests to run'
        required: false
        default: ''

env:
  NODE_VERSION: '20'

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: software

      - name: Run all tests
        run: pnpm test
        working-directory: software

      - name: Run convergence tests
        run: pnpm vitest run src/phos-v2/convergence
        working-directory: software/p31ca

      - name: Run shared package tests
        run: pnpm --filter @p31/shared test
        working-directory: software

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/coverage/
            **/*.test.xml

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Test Pages endpoints
        run: |
          echo "Testing Spaceship Earth..."
          curl -sf https://spaceship-earth.pages.dev/ > /dev/null && echo "OK" || echo "FAILED"
          echo "Testing Bonding..."
          curl -sf https://bonding.pages.dev/ > /dev/null && echo "OK" || echo "FAILED"

      - name: Test worker health
        run: |
          echo "Testing donate-api..."
          curl -sf https://donate-api.phosphorus31.org/health > /dev/null 2>&1 && echo "OK" || echo "unavailable"

      - name: Generate nightly report
        run: |
          echo "## Nightly QA Report - $(date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All automated tests completed. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
