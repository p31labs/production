name: FRUIT Gate — k4-cage
on: [pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tsx ../../scripts/check-maturity-gate.ts k4-cage ../../.p31/badges
