<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="white"/>
  <text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">Your Brain's Battery Sparks</text>
  <text x="400" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">Color in the calcium sparks to make them glow!</text>

  <!-- Neuron cell body (soma) -->
  <circle cx="300" cy="300" r="60" fill="none" stroke="#333" stroke-width="3"/>

  <!-- Nucleus -->
  <circle cx="300" cy="300" r="25" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Dendrites (branches coming in) -->
  <path d="M240 280 Q180 240 140 180 Q120 150 100 130" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <path d="M245 310 Q170 310 120 340 Q90 360 70 370" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <path d="M240 260 Q190 200 150 230 Q120 250 90 240" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M255 340 Q200 380 160 400 Q130 420 100 430" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Axon (the long tail) -->
  <path d="M360 300 Q420 290 480 270 Q540 250 600 240 Q650 235 700 230" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- Axon terminal branches -->
  <path d="M700 230 Q730 210 750 190" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M700 230 Q730 230 760 230" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M700 230 Q730 250 750 270" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Terminal buttons (round ends) -->
  <circle cx="750" cy="190" r="12" fill="none" stroke="#333" stroke-width="2.5"/>
  <circle cx="760" cy="230" r="12" fill="none" stroke="#333" stroke-width="2.5"/>
  <circle cx="750" cy="270" r="12" fill="none" stroke="#333" stroke-width="2.5"/>

  <!-- Myelin sheath (insulation segments) -->
  <rect x="420" y="265" width="40" height="22" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="490" y="258" width="40" height="22" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="560" y="249" width="40" height="22" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="630" y="240" width="40" height="22" rx="5" fill="none" stroke="#333" stroke-width="2"/>

  <!-- Calcium sparks (stars/bursts at synapses) -->
  <!-- Spark 1 -->
  <g transform="translate(740, 190)">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#333" stroke-width="2"/>
    <line x1="-15" y1="0" x2="15" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#333" stroke-width="1.5"/>
    <line x1="10" y1="-10" x2="-10" y2="10" stroke="#333" stroke-width="1.5"/>
  </g>
  <!-- Spark 2 -->
  <g transform="translate(750, 230)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#333" stroke-width="2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#333" stroke-width="1.5"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#333" stroke-width="1.5"/>
  </g>
  <!-- Spark 3 -->
  <g transform="translate(740, 270)">
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#333" stroke-width="2"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#333" stroke-width="2"/>
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#333" stroke-width="1.5"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#333" stroke-width="1.5"/>
  </g>

  <!-- Label -->
  <text x="300" y="520" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Color the calcium sparks yellow or gold to make them glow!</text>

  <!-- Legend -->
  <rect x="280" y="545" width="15" height="15" fill="none" stroke="#333" stroke-width="2"/>
  <text x="300" y="557" font-family="sans-serif" font-size="12" fill="#999">= Neuron cell body</text>
  <line x1="450" y1="552" x2="480" y2="552" stroke="#333" stroke-width="3"/>
  <text x="485" y="557" font-family="sans-serif" font-size="12" fill="#999">= Axon</text>
  <g transform="translate(580, 545)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="1.5"/>
    <line x1="-5" y1="0" x2="5" y2="0" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="590" y="557" font-family="sans-serif" font-size="12" fill="#999">= Calcium spark</text>
</svg>
