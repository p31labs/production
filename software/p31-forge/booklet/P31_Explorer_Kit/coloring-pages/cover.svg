<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <rect width="800" height="1000" fill="white"/>
  <!-- Title -->
  <text x="400" y="180" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#333" font-weight="bold">The Shapes</text>
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#333" font-weight="bold">That Build Us</text>

  <text x="400" y="280" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">A P31 Labs Explorer's Guide</text>

  <!-- Tetrahedron in center -->
  <g transform="translate(400, 480)">
    <!-- Back edge -->
    <line x1="0" y1="-80" x2="0" y2="120" stroke="#333" stroke-width="3"/>
    <!-- Bottom triangle -->
    <polygon points="-100,70 100,70 0,120" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Side edges from top to bottom corners -->
    <line x1="0" y1="-80" x2="-100" y2="70" stroke="#333" stroke-width="3"/>
    <line x1="0" y1="-80" x2="100" y2="70" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Cal standing next to tetrahedron -->
  <g transform="translate(180, 560)">
    <!-- Body -->
    <circle cx="0" cy="-60" r="50" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Face -->
    <circle cx="-12" cy="-65" r="5" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="12" cy="-65" r="5" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M-8 -50 Q0 -42 8 -50" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Battery gauge -->
    <rect x="-20" y="-30" width="40" height="15" rx="3" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="-14" y1="-27" x2="-14" y2="-18" stroke="#333" stroke-width="2"/>
    <line x1="-4" y1="-27" x2="-4" y2="-18" stroke="#333" stroke-width="2"/>
    <line x1="6" y1="-27" x2="6" y2="-18" stroke="#333" stroke-width="2"/>
    <line x1="16" y1="-27" x2="16" y2="-18" stroke="#333" stroke-width="2"/>
    <!-- Legs -->
    <line x1="-20" y1="-10" x2="-30" y2="40" stroke="#333" stroke-width="3"/>
    <line x1="20" y1="-10" x2="30" y2="40" stroke="#333" stroke-width="3"/>
    <!-- Arm holding spoon -->
    <line x1="50" y1="-60" x2="90" y2="-80" stroke="#333" stroke-width="3"/>
    <!-- Spoon -->
    <ellipse cx="100" cy="-85" rx="12" ry="8" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="108" y1="-80" x2="115" y2="-65" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Subtitle -->
  <text x="400" y="760" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">For curious kids who want to know</text>
  <text x="400" y="790" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">how their brain, their body, and the</text>
  <text x="400" y="820" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#666">universe stick together.</text>

  <!-- Byline -->
  <text x="400" y="900" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">P31 Labs, Inc. · p31ca.org</text>
</svg>
