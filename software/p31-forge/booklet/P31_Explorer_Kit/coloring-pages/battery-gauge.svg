<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <rect width="600" height="800" fill="white"/>
  <text x="300" y="60" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">Your Energy Battery</text>
  <text x="300" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">Color in how full your battery feels right now</text>

  <!-- Battery outline -->
  <rect x="150" y="140" width="300" height="500" rx="20" fill="none" stroke="#333" stroke-width="4"/>
  <rect x="220" y="640" width="160" height="40" rx="10" fill="none" stroke="#333" stroke-width="4"/>

  <!-- 5 segments with labels -->
  <line x1="170" y1="240" x2="430" y2="240" stroke="#ddd" stroke-width="2"/>
  <line x1="170" y1="340" x2="430" y2="340" stroke="#ddd" stroke-width="2"/>
  <line x1="170" y1="440" x2="430" y2="440" stroke="#ddd" stroke-width="2"/>
  <line x1="170" y1="540" x2="430" y2="540" stroke="#ddd" stroke-width="2"/>

  <!-- Segment labels -->
  <text x="140" y="200" text-anchor="end" font-family="sans-serif" font-size="16" fill="#666">Full</text>
  <text x="140" y="300" text-anchor="end" font-family="sans-serif" font-size="16" fill="#666">Good</text>
  <text x="140" y="400" text-anchor="end" font-family="sans-serif" font-size="16" fill="#666">Okay</text>
  <text x="140" y="500" text-anchor="end" font-family="sans-serif" font-size="16" fill="#666">Low</text>
  <text x="140" y="600" text-anchor="end" font-family="sans-serif" font-size="16" fill="#666">Empty</text>

  <!-- Arrows pointing to each segment -->
  <path d="M155 195 L165 195" stroke="#999" stroke-width="2"/>
  <path d="M155 295 L165 295" stroke="#999" stroke-width="2"/>
  <path d="M155 395 L165 395" stroke="#999" stroke-width="2"/>
  <path d="M155 495 L165 495" stroke="#999" stroke-width="2"/>
  <path d="M155 595 L165 595" stroke="#999" stroke-width="2"/>

  <!-- Instructions -->
  <text x="300" y="740" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">Color from the bottom up to show your energy level.</text>
  <text x="300" y="770" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ccc">Try green for good, yellow for okay, red for low!</text>
</svg>
