<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700">
  <rect width="800" height="700" fill="white"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#333" font-weight="bold">When Wires Get Crossed</text>
  <text x="400" y="70" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#999">Color the paths! Draw your own sparks!</text>

  <!-- Brain outline (simplified side view) -->
  <path d="M400 100
           Q500 90 560 150
           Q620 210 620 300
           Q620 380 580 430
           Q540 480 480 490
           Q420 500 400 500
           Q380 500 320 490
           Q260 480 220 430
           Q180 380 180 300
           Q180 210 240 150
           Q300 90 400 100 Z"
        fill="none" stroke="#333" stroke-width="3"/>

  <!-- Brain fold lines (sulci) -->
  <path d="M400 120 Q380 180 420 220" fill="none" stroke="#ddd" stroke-width="2"/>
  <path d="M480 140 Q460 200 500 250" fill="none" stroke="#ddd" stroke-width="2"/>
  <path d="M320 140 Q340 200 300 250" fill="none" stroke="#ddd" stroke-width="2"/>
  <path d="M550 220 Q520 280 560 340" fill="none" stroke="#ddd" stroke-width="2"/>
  <path d="M250 220 Q280 280 240 340" fill="none" stroke="#ddd" stroke-width="2"/>

  <!-- Spark paths going smoothly -->
  <path d="M300 200 Q350 250 380 300 Q400 330 420 370" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="6,4"/>
  <path d="M400 150 Q450 220 480 280 Q500 320 520 360" fill="none" stroke="#333" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Dizzy spark (confused path) -->
  <path d="M350 350 Q380 320 370 290 Q360 260 390 240 Q420 220 400 190 Q380 160 410 140" fill="none" stroke="#333" stroke-width="3" stroke-dasharray="3,4"/>

  <!-- Normal calcium sparks (happy) -->
  <g transform="translate(300, 200)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="2"/>
  </g>
  <g transform="translate(520, 360)">
    <line x1="0" y1="-10" x2="0" y2="10" stroke="#333" stroke-width="2"/>
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Dizzy spark (confused face on it) -->
  <g transform="translate(400, 240)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#333" stroke-width="2"/>
    <line x1="8" y1="-8" x2="-8" y2="8" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Labels -->
  <text x="300" y="180" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">Smooth spark</text>
  <text x="520" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">Smooth spark</text>
  <text x="400" y="220" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#999">Dizzy spark</text>

  <!-- Bottom text -->
  <text x="400" y="580" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">When calcium is low, the sparks get dizzy and your battery drains faster.</text>
  <text x="400" y="610" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#999">Color the smooth sparks green and the dizzy spark red!</text>

  <!-- Legend -->
  <g transform="translate(250, 640)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#333" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="25" y="5" font-family="sans-serif" font-size="12" fill="#999">Spark path</text>
  </g>
  <g transform="translate(450, 640)">
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#333" stroke-width="2"/>
    <text x="8" y="5" font-family="sans-serif" font-size="12" fill="#999">Calcium spark</text>
  </g>
</svg>
